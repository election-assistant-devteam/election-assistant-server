spring:
  datasource:
#    url: jdbc:h2:tcp:localhost/~/runningmate h2서버모드
#    url: jdbc:h2:mem:testdb
    url: jdbc:h2:tcp://localhost/~/h2-db/agora-test
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true
        dialect : org.hibernate.dialect.H2Dialect

server:
  port: 9001

runningmate:
  jwt:
    secret: secretkey1234secretkey1234secretkey1234secretkey1234secretkey1234secretkey1234
    access:
      expiredMs: 10000000
    refresh:
      expiredMs: 10000000

  api:
    publicData:
      key: apikey
    openNationalAssemblyInfo:
      key: apikey

cloud:
  aws:
    region:
      static: ap-northeast-2 # 서울 리전
    credentials:
      access-key: apikey
      secret-key: apikey
    s3:
      bucket: bucket